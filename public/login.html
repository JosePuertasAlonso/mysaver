<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Patrimonio — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090f;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #13131f;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon { font-size: 36px; }
    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: #e8e8f0;
      margin-top: 8px;
    }
    .logo-sub { font-size: 13px; color: #6b6b8a; margin-top: 4px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #9999b0;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      margin-top: 4px;
      transition: background .2s;
    }
    button:hover { background: #4f52d9; }
    button:disabled { background: #3a3a5c; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      padding: 10px 14px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">◈</div>
      <div class="logo-title">Mi Patrimonio</div>
      <div class="logo-sub">Accede con tu cuenta</div>
    </div>
    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" placeholder="tu usuario" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      <button type="submit" id="btn">Entrar</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      btn.disabled = true; btn.textContent = 'Entrando…'; err.style.display = 'none';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json();
        err.textContent = data.error || 'Error al iniciar sesión';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
